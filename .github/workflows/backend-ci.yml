name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Test, vet and build
    runs-on: ubuntu-latest

    # Disposable PostgreSQL used only by the repository integration tests in CI.
    # These credentials exist only inside this ephemeral service container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickordo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tickordo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tickordo_test?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
